<!doctype html>
<html lang="{{ ui_language }}" class="chat-page" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Progress — LinguaPath</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/motion.css') }}">
</head>
<body class="app-body progress-body">
  <div class="mobile-scrim" id="mobile-scrim" hidden></div>
  <aside class="app-sidebar" id="sidebar" aria-label="Conversation sidebar">
    <div class="sidebar-head">
      <a class="app-logo" href="{{ url_for('main.index') }}" aria-label="LinguaPath home"><span class="logo-mark">L</span><span class="logo-name">LinguaPath</span></a>
      <button class="icon-button" id="sidebar-toggle" type="button" aria-label="Collapse sidebar">‹</button>
    </div>
    <a class="new-chat-button" href="{{ url_for('main.chat') }}"><span>＋</span> New chat</a>
    <label class="search-box" for="conversation-search"><span aria-hidden="true">⌕</span><input id="conversation-search" type="search" placeholder="Search chats" autocomplete="off"></label>
    <div class="conversation-scroll" id="conversation-list" aria-live="polite"></div>
    <button class="archive-link" id="archive-toggle" type="button">Archived <span>›</span></button>
    <div class="sidebar-user">
      <div class="user-card"><span class="avatar">{{ current_user.email[0]|upper }}</span><span class="user-meta"><strong>{{ current_user.email }}</strong><small>{{ current_user.self_level }} learner</small></span></div>
    </div>
  </aside>
  <main class="app-main">
    <header class="topbar">
      <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="Open menu">☰</button>
      <strong>Progress</strong>
      <div class="topbar-levels"><a class="progress-link" href="{{ url_for('main.chat') }}">Back to chat <span>↗</span></a></div>
    </header>
    <section class="progress-stage">
      <div class="progress-content">
        <div class="progress-toolbar">
          <div><p class="eyebrow">Learning dashboard</p><h1>Your progress</h1></div>
          <div class="range-control" role="group" aria-label="Chart range">
            <button type="button" data-range="all" class="active">All</button>
            <button type="button" data-range="30d">Last 30 days</button>
            <button type="button" data-range="7d">Last 7 days</button>
          </div>
        </div>
        <div id="progress-error" class="progress-error" hidden></div>
        <section id="summary" class="progress-summary skeleton-block" aria-live="polite"></section>
        <section id="charts" class="progress-chart-grid" aria-live="polite"></section>
        <section class="progress-lower-grid">
          <article class="progress-panel"><h2>Level changes</h2><div id="level-changes"></div></article>
          <article class="progress-panel"><h2>Topics to revisit</h2><div id="weak-topics"></div></article>
        </section>
      </div>
    </section>
  </main>
  <div class="progress-modal-backdrop" id="progress-modal" hidden>
    <section class="progress-modal" role="dialog" aria-modal="true" aria-labelledby="progress-modal-title">
      <button type="button" class="icon-button" id="progress-modal-close" aria-label="Close">×</button>
      <h2 id="progress-modal-title"></h2><p id="progress-modal-summary"></p><ul id="progress-modal-reasons"></ul><p id="progress-modal-caveat"></p>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" integrity="sha384-vsrfeLOOY6KuIYKDlmVH5UiBmgIdB1oEf7p01YgWHuqmOHfZr374+odEv96n9tNC" crossorigin="anonymous"></script>
  <script type="module" src="{{ url_for('static', filename='js/progress.js') }}"></script>
</body>
</html>
